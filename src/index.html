<section class="section">
  <div class="container container-body">
    <article class="message quote">
      <div class="message-body">
        <div class="columns">
          <div class="column quote-img">
            <figure class="image is-128x128">
              <img
                src="cheshire.svg"
                alt="A Cheshire Cat"
                height="128"
                width="128"
              />
            </figure>
          </div>
          <div class="column quote-txt" style="max-width: 30rem">
            “We’re all mad here. I’m mad. You’re mad.”<br />
            “How do you know I’m mad?” said Alice.<br />
            “You must be,” said the Cat, “or you wouldn’t have come here.”<br />
            <div style="text-align: right">
              <em>— Lewis Carroll, Alice in Wonderland</em>
            </div>
          </div>
        </div>
      </div>
    </article>
    <div class="block content">
      <figure class="image portrait">
        <img alt="My Portrait" src="portrait.webp" />
      </figure>
      {{home.md}}
    </div>
  </div>
</section>
